name: Site refresh (every 2 days)

# Pulls the data that does NOT need a browser (live fixtures + match stats via
# ESPN / football-data.org / FotMob / Understat, and market values via Sofascore),
# refreshes the current season's player stats from Understat, rebuilds the match
# table, retrains both models, regenerates site/index.html, then commits the
# refreshed data/processed/ AND site/index.html back to master.
#
# Current-season goals / assists / minutes / xG now come from Understat
# (build_current_season_stats.py) so this no longer waits on a manual FBref
# scrape. FBref is still the source for finished seasons and for the deep stats
# (shots on target, fouls, passing / defense / GCA / keeper) - re-scrape those
# roughly monthly with `run_pipeline.md` step 1 (needs Chrome + a one-off
# WAF-captcha click). Transfermarkt scrape values are also monthly-manual.

on:
  schedule:
    - cron: "0 7 */2 * *"      # every 2 days, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # to kick deploy-pages.yml after committing

concurrency:
  group: site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      # optional: a residential/rotating proxy URL to route the Sofascore pull
      # around GitHub's datacenter IP block. Unset -> the pull goes direct and
      # falls back to the last good sofascore_values.csv when the IP is blocked.
      SOFASCORE_PROXY: ${{ secrets.SOFASCORE_PROXY }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # data/processed/ is committed (checkout brings it). data/raw/ is gitignored
      # - this cache only carries the fetch caches + raw scraper dumps so the pulls
      # below don't re-download from scratch. It is a speed-up, not load-bearing:
      # an eviction just makes one run slower, it never loses data.
      - name: Restore fetch cache
        id: datacache
        uses: actions/cache@v4
        with:
          path: |
            data/understat_cache
            data/soccerdata
            data/raw/live
            data/raw/tm
            data/raw/football_data/_elo_warmup.csv
          key: pipeline-fetchcache-${{ github.run_id }}
          restore-keys: |
            pipeline-fetchcache-

      - name: Pull league results + odds (football-data.co.uk)
        continue-on-error: true
        run: python src/pull_match_archive.py

      - name: Pull live fixtures + match stats (ESPN / football-data.org / FotMob / Understat)
        continue-on-error: true
        run: python src/pull_live.py

      - name: Pull current-season market values (Sofascore)
        continue-on-error: true
        run: python src/pull_sofascore_values.py

      # One pull, no --force. The script re-pulls only the season in progress
      # (finished seasons are already in the committed CSV and skipped); the full
      # list is here so a season that's somehow missing gets backfilled once.
      # Historical seasons (2020-24) exist so build_form_momentum.py covers the
      # outcome model's training era; 2024-26 cover build_player_elo.py's window.
      - name: Pull per-player per-match contributions (Understat) - live season only, rest already committed
        continue-on-error: true
        run: python src/pull_understat_player_matches.py --seasons 2020-21 2021-22 2022-23 2023-24 2024-25 2025-26 2026-27

      # current-season player season aggregates (goals/xg/xa/cards/...) - three
      # cheap API calls, merges into the committed file without touching 2020-25
      - name: Pull current-season player + match aggregates (Understat)
        continue-on-error: true
        run: python src/pull_understat.py --current --what both

      # the stats Understat doesn't carry: shots on target, fouls, tackles /
      # interceptions / blocks / clearances, touches, saves - from FotMob's
      # per-match player box scores (cached, so only new matches cost a request)
      - name: Pull current-season per-player stats (FotMob)
        continue-on-error: true
        run: python src/pull_fotmob_players.py --current

      # Serie A / Ligue 1 have no FBref player scrape - synthesise their
      # player-season rows (all seasons) from Understat + the wfr mirror + FotMob
      # + value_history. Idempotent; must run before build_current_season_stats.
      - name: Build Serie A / Ligue 1 player-season rows (Understat spine)
        run: python src/build_understat_player_seasons.py

      # fold Understat + FotMob's current season into fbref_player_season_stats.csv
      # so the value model / site cards have fresh goals/assists/minutes/xG/SoT/
      # fouls without a manual FBref scrape (finished seasons + the unused deep
      # FBref columns stay as the last FBref parse left them)
      - name: Refresh current-season player stats (Understat + FotMob)
        run: python src/build_current_season_stats.py

      - name: Rebuild tables
        run: |
          python src/build_value_history.py
          python src/build_matches_all.py
          python src/build_squad_features.py
          python src/build_match_model_table.py

      - name: Retrain models
        run: |
          python src/train_value_model.py
          python src/build_form_momentum.py
          python src/build_match_model_table.py
          python src/train_outcome_model.py --hybrid

      - name: Build player Elo (no market-value inputs - last 3 seasons of real output)
        continue-on-error: true
        run: python src/build_player_elo.py

      - name: Regenerate the site
        run: python src/export_site_data.py

      - name: Commit refreshed data + site and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed site/index.html
          if git diff --cached --quiet; then
            echo "nothing changed - nothing to commit"
          else
            git commit -m "Auto refresh: fixtures, odds, values, Understat current-season stats, models + site ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin master
            git push
            # a GITHUB_TOKEN push doesn't trigger deploy-pages.yml's push event
            gh workflow run deploy-pages.yml || echo "(no deploy-pages workflow / Pages not enabled yet)"
          fi
