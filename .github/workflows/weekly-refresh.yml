name: Weekly site refresh

# Pulls the data that does NOT need a browser (live fixtures + match stats via
# ESPN / football-data.org / FotMob / Understat, and market values via Sofascore),
# rebuilds the match table, retrains both models, regenerates site/index.html and
# commits it.
#
# NOT refreshed here: FBref counting stats (goals / assists / minutes) and
# Transfermarkt scrape values - those need a real Chrome window (nodriver) and a
# one-off WAF-captcha click, so run `run_pipeline.md` step 1 locally now and then
# and commit the resulting site/index.html the same way.

on:
  schedule:
    - cron: "0 7 * * 1"        # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # to kick deploy-pages.yml after committing

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # data/ is gitignored - carry the built tables + soccerdata caches between
      # runs. The rotating key always writes a fresh entry; restore-keys falls
      # back to the newest previous one.
      - name: Restore data cache
        id: datacache
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            data/understat_cache
            data/soccerdata
            data/raw/live
            data/raw/tm
            data/raw/football_data/_elo_warmup.csv
          key: pipeline-data-${{ github.run_id }}
          restore-keys: |
            pipeline-data-

      # cold start only: pull the seed the maintainer published once with
      #   tar czf pipeline-seed.tar.gz data/processed data/raw/football_data/_elo_warmup.csv
      #   gh release create pipeline-seed pipeline-seed.tar.gz -t "pipeline data seed"
      - name: Seed data (first run)
        if: ${{ hashFiles('data/processed/fbref_player_season_stats.csv') == '' }}
        run: |
          gh release download pipeline-seed --pattern "pipeline-seed.tar.gz" --output seed.tar.gz
          tar xzf seed.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pull league results + odds (football-data.co.uk)
        continue-on-error: true
        run: python src/pull_match_archive.py

      - name: Pull live fixtures + match stats (ESPN / football-data.org / FotMob / Understat)
        continue-on-error: true
        run: python src/pull_live.py

      - name: Pull current-season market values (Sofascore)
        continue-on-error: true
        run: python src/pull_sofascore_values.py

      # --force + all 3 covers build_player_elo.py's WINDOW_SEASONS every run - cheap once
      # data/understat_cache is warm (a cache hit, same as the local backfill this was verified
      # against), and guarantees player_id/team_id are there even before the persisted CI cache
      # has ever seen a pull done after those columns were added.
      - name: Pull per-player per-match contributions (Understat) - last 3 seasons, live one always fresh
        continue-on-error: true
        run: python src/pull_understat_player_matches.py --seasons ${{ env.WINDOW_SEASONS }} --force
        env:
          WINDOW_SEASONS: "2024-25 2025-26 2026-27"   # keep in sync with build_player_elo.py's WINDOW_SEASONS

      - name: Rebuild tables
        run: |
          python src/build_matches_all.py
          python src/build_squad_features.py
          python src/build_match_model_table.py
          python src/build_value_history.py

      - name: Retrain models
        run: |
          python src/train_value_model.py
          python src/build_form_momentum.py
          python src/build_match_model_table.py
          python src/train_outcome_model.py --hybrid

      - name: Build player Elo (no market-value inputs - last 3 seasons of real output)
        continue-on-error: true
        run: python src/build_player_elo.py

      - name: Regenerate the site
        run: python src/export_site_data.py

      - name: Commit site/index.html and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "site unchanged - nothing to commit"
          else
            git commit -m "Weekly site refresh: fixtures, odds, market values ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin master
            git push
            # a GITHUB_TOKEN push doesn't trigger deploy-pages.yml's push event
            gh workflow run deploy-pages.yml || echo "(no deploy-pages workflow / Pages not enabled yet)"
          fi
