name: Weekly site refresh

# Pulls the data that does NOT need a browser (live fixtures + match stats via
# ESPN / football-data.org / FotMob / Understat, and market values via Sofascore),
# rebuilds the match table, retrains both models, regenerates site/index.html,
# then commits the refreshed data/processed/ AND site/index.html back to master.
#
# NOT refreshed here: FBref counting stats (goals / assists / minutes) and
# Transfermarkt scrape values - those need a real Chrome window (nodriver) and a
# one-off WAF-captcha click, so run `run_pipeline.md` step 1 locally now and then;
# refresh_player_stats.py commits data/processed + site/index.html the same way.

on:
  schedule:
    - cron: "0 7 * * 1"        # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # to kick deploy-pages.yml after committing

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      # optional: a residential/rotating proxy URL to route the Sofascore pull
      # around GitHub's datacenter IP block. Unset -> the pull goes direct and
      # falls back to the last good sofascore_values.csv when the IP is blocked.
      SOFASCORE_PROXY: ${{ secrets.SOFASCORE_PROXY }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # data/processed/ is committed (checkout brings it). data/raw/ is gitignored
      # - this cache only carries the fetch caches + raw scraper dumps so the pulls
      # below don't re-download from scratch. It is a speed-up, not load-bearing:
      # an eviction just makes one run slower, it never loses data.
      - name: Restore fetch cache
        id: datacache
        uses: actions/cache@v4
        with:
          path: |
            data/understat_cache
            data/soccerdata
            data/raw/live
            data/raw/tm
            data/raw/football_data/_elo_warmup.csv
          key: pipeline-fetchcache-${{ github.run_id }}
          restore-keys: |
            pipeline-fetchcache-

      - name: Pull league results + odds (football-data.co.uk)
        continue-on-error: true
        run: python src/pull_match_archive.py

      - name: Pull live fixtures + match stats (ESPN / football-data.org / FotMob / Understat)
        continue-on-error: true
        run: python src/pull_live.py

      - name: Pull current-season market values (Sofascore)
        continue-on-error: true
        run: python src/pull_sofascore_values.py

      # One pull, no --force. The script re-pulls only the season in progress
      # (finished seasons are already in the committed CSV and skipped); the full
      # list is here so a season that's somehow missing gets backfilled once.
      # Historical seasons (2020-24) exist so build_form_momentum.py covers the
      # outcome model's training era; 2024-26 cover build_player_elo.py's window.
      - name: Pull per-player per-match contributions (Understat) - live season only, rest already committed
        continue-on-error: true
        run: python src/pull_understat_player_matches.py --seasons 2020-21 2021-22 2022-23 2023-24 2024-25 2025-26 2026-27

      - name: Rebuild tables
        run: |
          python src/build_matches_all.py
          python src/build_squad_features.py
          python src/build_match_model_table.py
          python src/build_value_history.py

      - name: Retrain models
        run: |
          python src/train_value_model.py
          python src/build_form_momentum.py
          python src/build_match_model_table.py
          python src/train_outcome_model.py --hybrid

      - name: Build player Elo (no market-value inputs - last 3 seasons of real output)
        continue-on-error: true
        run: python src/build_player_elo.py

      - name: Regenerate the site
        run: python src/export_site_data.py

      - name: Commit refreshed data + site and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed site/index.html
          if git diff --cached --quiet; then
            echo "nothing changed - nothing to commit"
          else
            git commit -m "Weekly refresh: fixtures, odds, market values, Understat, models + site ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin master
            git push
            # a GITHUB_TOKEN push doesn't trigger deploy-pages.yml's push event
            gh workflow run deploy-pages.yml || echo "(no deploy-pages workflow / Pages not enabled yet)"
          fi
