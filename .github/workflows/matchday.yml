name: Matchday re-score (confirmed XI)

# Every 30 minutes: if a big-5 league match kicks off in the next ~2 hours and
# FotMob has its confirmed lineup, re-score it on the XI (src/matchday_rescore.py:
# share of each side's top-3 by value missing -> fitted expected-goals
# adjustment) and append the plain + XI-adjusted odds to
# data/processed/predictions_ledger_xi.csv. The site's Track Record tab scores
# those against results at the next full refresh.
#
# The first step is a standard-library-only check (src/matchday_due.py), so a
# run with nothing kicking off ends in seconds without installing anything.

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: matchday
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Any league kickoff in the next ~2 hours?
        id: due
        run: python src/matchday_due.py

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        run: pip install -r requirements.lock

      - name: Re-score matches with a confirmed XI
        if: steps.due.outputs.due == 'true'
        run: python src/matchday_rescore.py

      - name: Commit new XI snapshots
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/predictions_ledger_xi.csv
          if git diff --cached --quiet; then
            echo "no new XI snapshots"
          else
            git commit -m "Matchday XI snapshots ($(date -u +%Y-%m-%dT%H:%MZ))"
            # shallow checkout: fetch enough history to rebase onto anything the
            # every-2-days refresh pushed meanwhile
            git fetch --depth=50 origin "$GITHUB_REF_NAME"
            git rebase --autostash FETCH_HEAD
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
