name: Deploy site to GitHub Pages

# Publishes the site/index.html built by the last master refresh. The page is
# no longer committed - refresh.yml uploads it inside the `latest-build`
# release asset (src/sync_build.py) and then runs this workflow. A template
# change (site/template.html) goes live with the next refresh, or run
# refresh.yml by hand. One-time setup: repo Settings -> Pages -> Source:
# "GitHub Actions".

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Fetch the built page from the latest-build release
        run: |
          python3 src/sync_build.py fetch
          mkdir -p _site
          cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
