name: Deploy site to GitHub Pages

# Publishes site/index.html whenever it changes (the weekly refresh commits it,
# or you commit a local FBref re-scrape). One-time setup: repo Settings -> Pages
# -> Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths: ["site/index.html"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Stage the single page as the site root
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
